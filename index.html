<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>등록금 언제 낼까요? · 학점등록 트리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF8F3;
    --paper:#FFFFFF;
    --ink:#1C2B45;
    --ink-soft:#5B6478;
    --gold:#B3872F;
    --gold-soft:#EFE2C4;
    --brick:#B14432;
    --brick-soft:#F6E1DC;
    --line:#E4DFD2;
    --line-soft:#EFEBE0;
    --branch:#C9BFA3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 6%, rgba(179,135,47,0.08), transparent 40%),
      radial-gradient(circle at 90% 96%, rgba(177,68,50,0.06), transparent 45%),
      var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 0 60px;
  }
  .head{max-width:640px; margin:0 auto 18px; padding:0 20px; text-align:center;}
  .eyebrow{font-size:12px; letter-spacing:.14em; font-weight:700; color:var(--gold); margin-bottom:6px;}
  h1{font-family:'Noto Serif KR', serif; font-weight:900; font-size:24px; margin:0 0 6px; letter-spacing:-0.01em;}
  .sub{font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0 0 16px;}
  .toolbar{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .tool-btn{
    font-family:inherit; font-size:12.5px; font-weight:700;
    padding:9px 16px; border-radius:20px; cursor:pointer;
    border:1.5px solid var(--ink); background:var(--ink); color:#fff;
  }
  .tool-btn.ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  .tool-btn:hover{opacity:.88;}

  .tree-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:30px 20px 10px;
  }
  .tree{
    display:flex;
    justify-content:center;
    min-width:max-content;
    margin:0 auto;
  }
  .tree > ul{
    display:flex;
    justify-content:center;
    list-style:none; margin:0; padding:0;
  }
  .tree li{
    list-style:none;
    position:relative;
    padding:26px 10px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .tree li::before,
  .tree li::after{
    content:"";
    position:absolute;
    top:0;
    width:50%;
    height:26px;
    border-top:2px solid var(--branch);
  }
  .tree li::before{ right:50%; border-right:2px solid var(--branch); }
  .tree li::after{ left:50%; border-left:2px solid var(--branch); }
  .tree li:first-child::before{ border:none; }
  .tree li:last-child::after{ border:none; }
  .tree li:only-child{ padding-top:0; }
  .tree li:only-child::before, .tree li:only-child::after{ display:none; }
  .tree > ul > li{ padding-top:0; }
  .tree > ul > li::before, .tree > ul > li::after{ display:none; }

  .tree li > ul{
    position:relative;
    padding-top:26px;
    display:flex;
    justify-content:center;
    list-style:none; margin:0;
    opacity:0;
    transition:opacity .35s ease;
  }
  .tree li > ul.show{ opacity:1; }
  .tree li > ul::before{
    content:"";
    position:absolute;
    top:0; left:50%;
    width:2px; height:26px;
    background:var(--branch);
    transform:translateX(-50%);
  }

  .tnode{
    width:180px;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:13px 12px;
    box-shadow:0 10px 22px -16px rgba(28,43,69,.45);
    opacity:0;
    transform:translateY(-14px) scale(.94);
    transition:opacity .38s ease, transform .38s cubic-bezier(.2,.9,.3,1.2);
  }
  .tnode.show{ opacity:1; transform:translateY(0) scale(1); }
  .tnode.root{ width:210px; border-color:var(--gold); border-width:2px; }

  .tnode.sector-node{ width:280px; }
  .sector-options{ display:flex; gap:8px; }
  .sector-btn{
    flex:1;
    font-family:inherit;
    background:#fff;
    border-radius:11px;
    padding:12px 8px 10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:3px;
    transition:transform .12s ease, background .15s ease;
  }
  .sector-btn:hover{ transform:translateY(-2px); }
  .sector-btn:active{ transform:scale(.97); }
  .sector-btn.opt-delay{ border:1.6px solid var(--gold); }
  .sector-btn.opt-delay:hover, .sector-btn.opt-delay.active{ background:var(--gold-soft); }
  .sector-btn.opt-fail{ border:1.6px solid var(--brick); }
  .sector-btn.opt-fail:hover, .sector-btn.opt-fail.active{ background:var(--brick-soft); }
  .sector-icon{ font-size:20px; }
  .sector-title{ font-family:'Noto Serif KR', serif; font-weight:900; font-size:13px; color:var(--ink); }
  .sector-desc{ font-size:9px; line-height:1.45; color:var(--ink-soft); }

  .sec-tag{
    display:inline-block; font-size:9px; font-weight:800;
    padding:3px 7px; border-radius:10px; margin-bottom:7px; letter-spacing:.01em;
    text-align:left;
  }
  .sec-tag.delay{ background:var(--gold-soft); color:#8A6417; }
  .sec-tag.fail{ background:var(--brick-soft); color:var(--brick); }

  .tnode.sec-delay{ border-color:var(--gold); }
  .tnode.sec-fail{ border-color:var(--brick); }

  .tree li.branch-delay::before,
  .tree li.branch-delay::after{ border-color:var(--gold); }
  .tree li.branch-delay > ul::before{ background:var(--gold); }
  .tree li.branch-fail::before,
  .tree li.branch-fail::after{ border-color:var(--brick); }
  .tree li.branch-fail > ul::before{ background:var(--brick); }

  .tnode-q{
    font-family:'Noto Serif KR', serif;
    font-weight:700; font-size:12.5px; line-height:1.48;
    margin:0 0 4px; text-align:left;
  }
  .tnode-sub{ font-size:10px; color:var(--ink-soft); margin:0 0 10px; text-align:left; }
  .tnode-actions{ display:flex; gap:6px; }
  .tbtn{
    flex:1; font-family:inherit; font-size:11.5px; font-weight:700;
    padding:7px 0; border-radius:8px; cursor:pointer; background:#fff;
    border:1.4px solid var(--line); color:var(--ink-soft);
    transition:all .15s ease;
  }
  .tbtn.yes{ color:var(--gold); border-color:var(--gold); }
  .tbtn.no{ color:var(--brick); border-color:var(--brick); }
  .tbtn.yes.active{ background:var(--gold-soft); }
  .tbtn.no.active{ background:var(--brick-soft); }
  .tbtn:hover{ filter:brightness(0.97); }

  .tnode.leaf{ text-align:left; }
  .tnode.leaf.gold{ border-color:var(--gold); }
  .tnode.leaf.brick{ border-color:var(--brick); }
  .leaf-badge{
    display:inline-block; font-size:9.5px; font-weight:800;
    padding:3px 8px; border-radius:12px; margin-bottom:6px; letter-spacing:.02em;
  }
  .leaf-badge.yes{ background:var(--gold-soft); color:#8A6417; }
  .leaf-badge.no{ background:var(--line-soft); color:var(--ink-soft); }
  .leaf-badge.grad{ background:var(--brick-soft); color:var(--brick); }
  .leaf-date{ font-family:'Noto Serif KR', serif; font-weight:900; font-size:14.5px; margin:0 0 4px; color:var(--ink); }
  .leaf-desc{ font-size:10px; line-height:1.55; color:var(--ink-soft); margin:0; }
  .leaf-desc b{ color:var(--ink); }

  .legend{
    max-width:640px; margin:26px auto 0; padding:0 20px;
    font-size:11.5px; color:var(--ink-soft); text-align:center; line-height:1.7;
  }

  .table-section{ max-width:640px; margin:22px auto 0; padding:0 20px; }
  .table-toggle{
    width:100%; background:var(--paper); border:1px solid var(--line);
    color:var(--ink); font-size:12.5px; font-weight:700; padding:12px;
    border-radius:12px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:6px; font-family:inherit;
  }
  .table-toggle .chev{ transition:transform .2s ease; }
  .table-toggle.open .chev{ transform:rotate(180deg); }
  .full-table-wrap{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .full-table-wrap.open{ max-height:700px; }
  .full-table-inner{ padding-top:12px; }
  .ft-scroll{ overflow-x:auto; border-radius:10px; border:1px solid var(--line); }
  table.ft{ border-collapse:collapse; width:100%; min-width:460px; font-size:11px; background:var(--paper); }
  table.ft th{ background:var(--ink); color:#fff; font-weight:700; padding:8px 6px; text-align:center; }
  table.ft td{ padding:8px 6px; text-align:center; border-bottom:1px solid var(--line-soft); border-right:1px solid var(--line-soft); color:var(--ink); }
  table.ft td.grp{ font-weight:700; }
  tr.grp-a td.grp{ background:var(--gold-soft); }
  tr.grp-b td.grp{ background:var(--brick-soft); }
  .ok{ color:#8A6417; font-weight:700; }
  .no{ color:var(--brick); font-weight:700; }
  .ft-note{ font-size:10.5px; color:var(--ink-soft); line-height:1.6; margin-top:8px; text-align:left; }

  .footer-note{
    text-align:center; font-size:11px; color:var(--ink-soft);
    margin-top:28px; padding:0 20px; line-height:1.6;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="eyebrow">계명대학교 · 장학복지팀</div>
    <h1>등록금, 언제 낼까요?</h1>
    <p class="sub">질문의 <b style="color:var(--ink)">예 / 아니오</b>를 눌러보면 가지가 뻗어나가요.<br>다른 선택지도 눌러서 자유롭게 비교해볼 수 있어요 🌲</p>
    <div class="toolbar">
      <button class="tool-btn" onclick="expandAll()">🌲 전체 펼쳐보기</button>
      <button class="tool-btn ghost" onclick="resetTree()">처음으로</button>
    </div>
  </div>

  <div class="tree-scroll">
    <div class="tree" id="tree"></div>
  </div>

  <div class="table-section">
    <button class="table-toggle" id="toggleBtn" onclick="toggleTable()">
      <span>원본 안내표로 보기</span><span class="chev">▾</span>
    </button>
    <div class="full-table-wrap" id="tableWrap">
      <div class="full-table-inner" id="tableInner"></div>
    </div>
  </div>

  <p class="footer-note">2026학년도 2학기 · 8학기 이수자 기준(건축학과 10학기) 안내입니다.<br>정확한 개인별 사항은 학과 사무실 또는 장학복지팀으로 문의해주세요.</p>

<script>
const tree = {
  start: {
    q: "정규학기(8학기, 건축학과 10학기)를 모두 마치고 이번에 정상적으로 졸업하시나요?",
    sub: "2026학년도 2학기 기준",
    yes: {result:'graduate'},
    no: 'sectorChoice'
  },
  sectorChoice: {
    type: 'sector',
    q: "정규학기를 마치지 못하셨네요. 아래 두 경우 중 어디에 해당하시나요?",
    delay: 'delayPlan',
    fail: 'failPlan'
  },
  delayPlan: {
    q: "이번 학기에 강의를 들으실 계획이 있으신가요?",
    sub: "교직이수 등",
    section: 'delay',
    sectionTag: '🎓 졸업유예 섹션 · 졸업요건은 갖췄음',
    yes: 'delayCredit',
    no: {result:'delay_no_plan'}
  },
  delayCredit: {
    q: "신청하신 학점이 9학점 이내인가요?",
    sub: "",
    section: 'delay',
    yes: {result:'delay_under9'},
    no: {result:'delay_over10'}
  },
  failPlan: {
    q: "졸업학점을 채우기 위한 수강신청 계획이 있으신가요?",
    sub: "잔여 학점 이수 등",
    section: 'fail',
    sectionTag: '📚 초과학기 섹션 · 졸업요건 미충족',
    yes: 'failThesis',
    no: {result:'fail_no_plan'}
  },
  failThesis: {
    q: "졸업논문(0학점)만 수강신청 하시나요?",
    sub: "",
    section: 'fail',
    yes: {result:'fail_thesis'},
    no: 'failCredit'
  },
  failCredit: {
    q: "이번 학기 신청 학점, 9학점을 넘지 않나요?",
    sub: "",
    section: 'fail',
    yes: {result:'fail_under9'},
    no: {result:'fail_over10'}
  }
};

const results = {
  graduate:{
    type:'brick', badge:'🎉 졸업', badgeType:'grad',
    date:'2026.8.20 졸업', desc:'정규학기를 모두 마쳐 <b>정상적으로 졸업</b>하십니다. 축하드려요!'
  },
  delay_no_plan:{
    type:'gold', section:'delay', badgeType:'no', badgeText:'신청 불요',
    date:'8.24~8.27', desc:'1학점이 <b>자동 생성</b>돼요. 별도 신청 없이 8.24(월)~27(목) 납부하시면 돼요.'
  },
  delay_under9:{
    type:'gold', section:'delay', badgeType:'yes', badgeText:'신청 필요',
    date:'9.9~9.11', desc:'<b>학점등록 신청</b> 필수! 9.9(수)~11(금) 납부하시면 돼요.'
  },
  delay_over10:{
    type:'gold', section:'delay', badgeType:'no', badgeText:'신청 불요',
    date:'9.9~9.11', desc:'<b>정규등록금</b>을 납부해요. 9.9(수)~11(금) 납부하시면 돼요.'
  },
  fail_no_plan:{
    type:'brick', section:'fail', badgeType:'yes', badgeText:'신청 필요',
    date:'9.9~9.11', desc:'졸업기준(외국어 등) 미충족. <b>학점등록 신청</b> 필수, 9.9(수)~11(금) 납부.'
  },
  fail_thesis:{
    type:'brick', section:'fail', badgeType:'yes', badgeText:'신청 필요',
    date:'9.9~9.11', desc:'졸업논문(0학점)만 신청해도 <b>학점등록 신청</b> 필수예요. 9.9(수)~11(금) 납부.'
  },
  fail_under9:{
    type:'brick', section:'fail', badgeType:'yes', badgeText:'신청 필요',
    date:'9.9~9.11', desc:'<b>학점등록 신청</b> 필수! 9.9(수)~11(금) 납부하시면 돼요.'
  },
  fail_over10:{
    type:'brick', section:'fail', badgeType:'no', badgeText:'신청 불요',
    date:'9.9~9.11', desc:'<b>정규등록금</b>을 납부해요. 9.9(수)~11(금) 납부하시면 돼요.'
  }
};

const treeEl = document.getElementById('tree');

function buildTnode(key, isRoot){
  const node = tree[key];
  const wrap = document.createElement('div');
  wrap.dataset.key = key;

  if(node.type === 'sector'){
    wrap.className = 'tnode sector-node' + (isRoot ? ' root' : '');
    wrap.innerHTML = `
      <div class="tnode-q">${node.q}</div>
      <div class="sector-options">
        <button class="sector-btn opt-delay" data-side="delay">
          <span class="sector-icon">🎓</span>
          <span class="sector-title">졸업유예</span>
          <span class="sector-desc">졸업요건은 갖췄지만<br>본인 의사로 미루는 경우</span>
        </button>
        <button class="sector-btn opt-fail" data-side="fail">
          <span class="sector-icon">📚</span>
          <span class="sector-title">초과학기</span>
          <span class="sector-desc">졸업요건(학점·외국어 등)을<br>아직 못 채운 경우</span>
        </button>
      </div>
    `;
    wrap.querySelectorAll('[data-side]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btn.classList.add('active');
        onAnswer(key, btn.dataset.side, wrap);
      });
    });
    return wrap;
  }

  wrap.className = 'tnode' + (isRoot ? ' root' : '') + (node.section ? ` sec-${node.section}` : '');
  wrap.innerHTML = `
    ${node.sectionTag ? `<span class="sec-tag ${node.section}">${node.sectionTag}</span>` : ''}
    <div class="tnode-q">${node.q}</div>
    ${node.sub ? `<div class="tnode-sub">${node.sub}</div>` : '<div style="margin-bottom:10px"></div>'}
    <div class="tnode-actions">
      <button class="tbtn yes" data-side="yes">예</button>
      <button class="tbtn no" data-side="no">아니오</button>
    </div>
  `;
  wrap.querySelectorAll('.tbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.classList.add('active');
      onAnswer(key, btn.dataset.side, wrap);
    });
  });
  return wrap;
}

function buildLeaf(kind){
  const r = results[kind];
  const wrap = document.createElement('div');
  wrap.className = 'tnode leaf ' + r.type;
  const badgeHtml = kind === 'graduate'
    ? `<span class="leaf-badge grad">${r.badge}</span>`
    : `<span class="leaf-badge ${r.badgeType}">${r.badgeText}</span>`;
  wrap.innerHTML = `
    ${badgeHtml}
    <div class="leaf-date">${r.date}</div>
    <p class="leaf-desc">${r.desc}</p>
  `;
  return wrap;
}

function makeLi(){
  const li = document.createElement('li');
  return li;
}

function onAnswer(parentKey, side, parentNodeWrap){
  const parentLi = parentNodeWrap.closest('li');
  let childUl = parentLi.querySelector(':scope > ul');
  if(!childUl){
    childUl = document.createElement('ul');
    parentLi.appendChild(childUl);
  }

  const existing = childUl.querySelector(`li[data-side="${side}"]`);
  if(existing){
    existing.querySelector('.tnode').scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    return;
  }

  const next = tree[parentKey][side];
  const li = makeLi();
  li.dataset.side = side;

  let nodeEl;
  let childSection = null;
  if(typeof next === 'string'){
    nodeEl = buildTnode(next, false);
    childSection = tree[next].section;
  } else {
    nodeEl = buildLeaf(next.result);
    childSection = results[next.result].section;
  }
  if(childSection){
    li.classList.add('branch-' + childSection);
  }
  li.appendChild(nodeEl);

  // keep yes before no visually
  const noLi = childUl.querySelector('li[data-side="no"]');
  if(side === 'yes' && noLi){
    childUl.insertBefore(li, noLi);
  } else {
    childUl.appendChild(li);
  }

  requestAnimationFrame(()=>{
    childUl.classList.add('show');
    requestAnimationFrame(()=>{
      nodeEl.classList.add('show');
      setTimeout(()=>{
        nodeEl.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
      }, 200);
    });
  });
}

function initTree(){
  treeEl.innerHTML = '';
  const outerUl = document.createElement('ul');
  const rootLi = makeLi();
  const rootNode = buildTnode('start', true);
  rootLi.appendChild(rootNode);
  outerUl.appendChild(rootLi);
  treeEl.appendChild(outerUl);
  requestAnimationFrame(()=> rootNode.classList.add('show'));
}

function resetTree(){
  initTree();
}

function delay(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function expandAll(){
  initTree();
  await delay(150);
  await autoExpand('start');
}
async function autoExpand(key){
  const parentLi = findLiForKey(key);
  if(!parentLi) return;
  const wrap = parentLi.querySelector('.tnode');
  const node = tree[key];
  const sides = node.type === 'sector' ? ['delay', 'fail'] : ['yes', 'no'];

  for(const side of sides){
    const btn = wrap.querySelector(`[data-side="${side}"]`);
    if(btn){ btn.click(); await delay(260); }
  }
  for(const side of sides){
    if(typeof node[side] === 'string'){ await autoExpand(node[side]); }
  }
}

function findLiForKey(key){
  const nodeEl = treeEl.querySelector(`.tnode[data-key="${key}"]`);
  return nodeEl ? nodeEl.closest('li') : null;
}

function toggleTable(){
  const wrap = document.getElementById('tableWrap');
  const btn = document.getElementById('toggleBtn');
  wrap.classList.toggle('open');
  btn.classList.toggle('open');
}

document.getElementById('tableInner').innerHTML = `
  <div class="ft-scroll">
  <table class="ft">
    <thead>
      <tr><th>구분</th><th>수강신청 조건</th><th>신청 필요 여부</th><th>등록금 납부일정</th></tr>
